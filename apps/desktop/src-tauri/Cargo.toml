[package]
name = "frigate-desktop"
version = "0.1.0"
description = "Frigate desktop shell"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0-alpha.14", features = ["protocol-asset", "default"] }

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2.0.0-alpha.7", features = [] }
